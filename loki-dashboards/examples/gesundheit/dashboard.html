<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesundheits-Dashboard</title>
<!--
  ============================================================================
  GESUNDHEITS-DASHBOARD  —  self-contained Vorlage für den Loki-Dashboard-Skill
  ============================================================================
  Reines HTML + CSS + JS. KEINE externen Libs/CDN (offline-fähig im iframe).
  Dark Theme, Akzent Orange #F97316. Sparkline ist reines SVG (keine Lib).

  WIE ES SEINE DATEN BEKOMMT (Vorlage fürs Skill — bitte genau so übernehmen):
  ---------------------------------------------------------------------------
  Dieses Dashboard macht KEINEN eigenen fetch / API-Call. Es liest seine Daten
  aus der globalen Variable `window.LOKI_DATA`.

  WARUM: Der Hermes-Server liefert user-HTML über /api/file/raw mit dem Header
  "content-security-policy: sandbox allow-scripts allow-popups" — OHNE
  allow-same-origin. Ein per file/raw geladenes Dokument hätte daher einen
  OPAKEN (null) Origin und könnte KEINE same-origin-API-Calls machen
  ("Failed to fetch"). Deshalb lädt die loki-dashboards-EXTENSION die JSON-
  Dateien aus dem 'daten/'-Ordner PARENT-seitig (wo die API erlaubt ist) und
  reicht sie diesem Dashboard via `iframe.srcdoc` + injiziertem
  `window.LOKI_DATA` durch.

  KONTRAKT (von der Extension gesetzt):
    - window.LOKI_DATA       → Array der Datensätze, bereits nach 'date' sortiert.
                               Jeder Datensatz z.B. { date, steps, sleep_h, hrv }.
    - window.LOKI_DASHBOARD   → { folder, count } (Meta-Info, optional nutzbar).

  WRITE-BACK (Formular → Workspace, Vorlage fürs Skill — bitte genau so übernehmen):
  ---------------------------------------------------------------------------
    - window.LOKI.save(record, {file?}) → Promise.
      Sendet den Datensatz per postMessage an die Extension (den Parent); DIE
      validiert und schreibt ihn als '<ordner>/daten/<datei>.json' über den
      Host-Endpoint POST /api/file/save. Das Dashboard selbst macht weiterhin
      KEINEN fetch — es darf nur anfragen.
    - record: flaches JSON-Objekt. 'date' (YYYY-MM-DD) wird ergänzt falls es fehlt.
      Felder MÜSSEN dem schema.json des Dashboards entsprechen (Zahl als Zahl!).
    - file (optional): Dateiname wie '2026-06-07.json'. Default: '<date>.json'
      (idempotent pro Tag — gleicher Tag überschreibt). Für mehrere Einträge
      pro Tag einen Suffix nutzen: '<date>_morgens.json'.
    - Promise resolved mit {ok:true, file, path, rows} — 'rows' sind ALLE frisch
      geladenen Datensätze: damit direkt neu rendern (Live-Update ohne Reload).
      Promise rejected mit Error (Validierung, API-Fehler, 10s-Timeout).
    - Fallback-Pflicht: existiert window.LOKI?.save nicht (alte Extension),
      Formular deaktivieren und Hinweis zeigen — niemals stumm wegbrechen.

  Liegt window.LOKI_DATA leer/nicht vor, zeigt das Dashboard einen klaren
  Hinweis — das FORMULAR bleibt aber nutzbar (erster Eintrag muss möglich sein).

  Die Extension setzt sandbox="allow-scripts" (KEIN allow-same-origin nötig,
  da hier kein API-Zugriff mehr stattfindet).
  ============================================================================
-->
<style>
  :root {
    --bg: #0b0d16;
    --panel: #14161f;
    --border: #2a2d3a;
    --text: #e8e8ee;
    --muted: #9aa0b4;
    --accent: #F97316;
    --accent-soft: rgba(249, 115, 22, .14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 24px; overflow-y: auto;
  }
  .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  .head h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .head .sub { color: var(--muted); font-size: 13px; }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; border-top: 3px solid var(--accent);
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .card .value { font-size: 30px; font-weight: 800; margin-top: 6px; }
  .card .unit { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px;
  }
  .panel h2 { font-size: 14px; font-weight: 700; margin: 0 0 14px; }
  .chart { width: 100%; }
  .legend { display: flex; gap: 18px; margin-top: 10px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; background: var(--accent); }

  .notice {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 16px 18px; color: var(--text); line-height: 1.6;
  }
  .notice b { color: var(--accent); }
  .muted { color: var(--muted); }

  /* ── Eintrags-Formular (Write-Back via LOKI.save) ── */
  .form-panel { margin-top: 24px; }
  .form-grid { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 12px; align-items: end; }
  .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .field input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px;
    font: inherit;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .btn-save {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .btn-save:disabled { opacity: .55; cursor: wait; }
  .form-msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .form-msg.ok { color: #4ade80; }
  .form-msg.err { color: #f87171; }
  @media (max-width: 760px) { .form-grid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
  <div class="head">
    <h1>📊 Gesundheit</h1>
    <span class="sub" id="sub">lädt…</span>
  </div>
  <div id="content"></div>

  <!-- Eintrags-Formular: schreibt via LOKI.save() zurück in daten/<date>.json -->
  <div class="panel form-panel">
    <h2>➕ Eintrag erfassen</h2>
    <form id="entryForm" class="form-grid" novalidate>
      <div class="field">
        <label for="f-date">Datum</label>
        <input id="f-date" name="date" type="date" required>
      </div>
      <div class="field">
        <label for="f-steps">Schritte</label>
        <input id="f-steps" name="steps" type="number" min="0" step="1" placeholder="8500" required>
      </div>
      <div class="field">
        <label for="f-sleep">Schlaf (h)</label>
        <input id="f-sleep" name="sleep_h" type="number" min="0" max="24" step="0.1" placeholder="7.5" required>
      </div>
      <div class="field">
        <label for="f-hrv">HRV (ms)</label>
        <input id="f-hrv" name="hrv" type="number" min="0" step="1" placeholder="62" required>
      </div>
      <button type="submit" class="btn-save" id="saveBtn">💾 Speichern</button>
    </form>
    <div class="form-msg" id="formMsg" role="status"></div>
  </div>

<script>
(function () {
  'use strict';

  var content = document.getElementById('content');
  var sub = document.getElementById('sub');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
  }

  function showNotice(msg) {
    sub.textContent = 'Hinweis';
    content.innerHTML = '<div class="notice">' + msg + '</div>';
  }

  // ── Rendering ──────────────────────────────────────────────────────────────
  function fmt(n) {
    if (n == null || isNaN(n)) return '–';
    return Number(n).toLocaleString('de-DE');
  }

  // Simple SVG-Sparkline für eine Metrik über die Tage.
  function sparkline(values, opts) {
    opts = opts || {};
    var w = 560, h = 90, pad = 8;
    var n = values.length;
    if (!n) return '';
    var max = Math.max.apply(null, values);
    var min = Math.min.apply(null, values);
    if (max === min) { max = min + 1; }
    var iw = w - pad * 2, ih = h - pad * 2;
    var pts = values.map(function (v, i) {
      var x = pad + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
      var y = pad + ih - ((v - min) / (max - min)) * ih;
      return [x, y];
    });
    var line = pts.map(function (p, i) {
      return (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
    }).join(' ');
    var area = 'M' + pts[0][0].toFixed(1) + ' ' + (h - pad).toFixed(1)
      + ' ' + line.replace(/^M/, 'L')
      + ' L' + pts[n - 1][0].toFixed(1) + ' ' + (h - pad).toFixed(1) + ' Z';
    var dots = pts.map(function (p) {
      return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1)
        + '" r="3" fill="var(--accent)" />';
    }).join('');
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" '
      + 'width="100%" height="' + h + '" role="img" aria-label="' + esc(opts.label || '') + '">'
      + '<path d="' + area + '" fill="var(--accent-soft)" stroke="none" />'
      + '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" '
      + 'stroke-linejoin="round" stroke-linecap="round" />'
      + dots
      + '</svg>';
  }

  function render(data) {
    if (!data.length) { showNotice('Keine gültigen Datensätze gefunden.'); return; }

    var today = data[data.length - 1];
    sub.textContent = data.length + ' Tage · zuletzt ' + esc(today.date);

    var cards =
      '<div class="cards">'
      + '<div class="card"><div class="label">Schritte heute</div>'
        + '<div class="value">' + fmt(today.steps) + '</div></div>'
      + '<div class="card"><div class="label">Schlaf heute</div>'
        + '<div class="value">' + fmt(today.sleep_h) + '<span class="unit">h</span></div></div>'
      + '<div class="card"><div class="label">HRV heute</div>'
        + '<div class="value">' + fmt(today.hrv) + '<span class="unit">ms</span></div></div>'
      + '</div>';

    var steps = data.map(function (d) { return Number(d.steps) || 0; });
    var labels = data.map(function (d) { return esc(d.date); }).join(' · ');

    var trend =
      '<div class="panel">'
      + '<h2>Schritte – Verlauf</h2>'
      + sparkline(steps, { label: 'Schritte-Verlauf' })
      + '<div class="legend"><span><span class="dot"></span>Schritte pro Tag</span>'
      + '<span class="muted">' + labels + '</span></div>'
      + '</div>';

    content.innerHTML = cards + trend;
  }

  // ── Start ────────────────────────────────────────────────────────────────
  // Daten kommen aus window.LOKI_DATA (von der Extension injiziert, bereits nach
  // 'date' sortiert). Dieses Dashboard macht KEINEN fetch / API-Call mehr.
  var data = Array.isArray(window.LOKI_DATA) ? window.LOKI_DATA : [];

  if (!data.length) {
    showNotice('<b>Noch keine Daten.</b><br>'
      + '<span class="muted">Die Loki-Dashboards-Extension reicht die JSON-Dateien '
      + 'aus dem Ordner <code>daten/</code> via <code>window.LOKI_DATA</code> durch '
      + '(je <code>{date, steps, sleep_h, hrv}</code>). '
      + 'Du kannst den ersten Eintrag direkt unten im Formular erfassen.</span>');
  } else {
    render(data);
  }

  // ── Eintrags-Formular (Write-Back via LOKI.save) ──────────────────────────
  // Submit → LOKI.save(record). Die Extension validiert, schreibt
  // daten/<date>.json und liefert ALLE frischen rows zurück → live neu rendern.
  var form = document.getElementById('entryForm');
  var saveBtn = document.getElementById('saveBtn');
  var formMsg = document.getElementById('formMsg');
  var dateInput = document.getElementById('f-date');

  function setMsg(text, kind) {
    formMsg.textContent = text || '';
    formMsg.className = 'form-msg' + (kind ? ' ' + kind : '');
  }

  // Default: heutiges Datum vorbelegen.
  try { dateInput.value = new Date().toISOString().slice(0, 10); } catch (_) {}

  // Fallback-Pflicht: ohne LOKI.save (alte Extension) Formular deaktivieren —
  // niemals stumm wegbrechen.
  if (!window.LOKI || typeof window.LOKI.save !== 'function') {
    saveBtn.disabled = true;
    setMsg('Speichern nicht verfügbar — die loki-dashboards-Extension ist veraltet (LOKI.save fehlt).', 'err');
  } else {
    // Reentrancy-Guard: schützt gegen Doppel-Submit. saveBtn.disabled blockt nur
    // den Button-KLICK — ein Enter im Datums-/Zahlenfeld feuert 'submit' trotzdem
    // und würde sonst einen zweiten LOKI.save auf dieselbe Datei auslösen.
    var saving = false;

    // numField(id): rohen Feldwert prüfen, BEVOR Number() greift. Number('') === 0,
    // ein leeres Pflichtfeld würde sonst als 0 gespeichert. Liefert null bei
    // leer/ungültig, sonst die geparste Zahl.
    function numField(id) {
      var raw = document.getElementById(id).value.trim();
      if (raw === '') return null;
      var n = Number(raw);
      return isFinite(n) ? n : null;
    }

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (saving) return; // bereits ein Save in flight → ignorieren

      var date = dateInput.value;
      var steps = numField('f-steps');
      var sleep_h = numField('f-sleep');
      var hrv = numField('f-hrv');

      // Schema-Treue: Datum YYYY-MM-DD, alle Zahlenfelder befüllt und numerisch.
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { setMsg('Bitte ein Datum wählen.', 'err'); return; }
      if (steps === null || sleep_h === null || hrv === null) {
        setMsg('Bitte alle Felder als Zahl ausfüllen.', 'err'); return;
      }

      var record = { date: date, steps: steps, sleep_h: sleep_h, hrv: hrv };

      saving = true;
      saveBtn.disabled = true;
      setMsg('Speichere…');

      window.LOKI.save(record).then(function (res) {
        saving = false;
        saveBtn.disabled = false;
        setMsg('Gespeichert: ' + res.file, 'ok');
        if (Array.isArray(res.rows) && res.rows.length) {
          data = res.rows;
          render(data); // Live-Update: Karten + Sparkline frisch
        }
      }).catch(function (err) {
        saving = false;
        saveBtn.disabled = false;
        setMsg(String(err && err.message || err), 'err');
      });
    });
  }
})();
</script>
</body>
</html>
